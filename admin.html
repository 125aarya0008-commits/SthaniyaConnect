<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WardPulse — Officer login</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F5F6F4; --panel:#FFFFFF; --panel-2:#EEF0ED; --line:#DBE0DB;
    --text:#161B1D; --muted:#5B6660; --muted-2:#8B948E;
    --amber:#C9660E; --amber-soft:#E8871E;
    --grade-a:#2F8A75; --grade-b:#B8860B; --grade-c:#C4571E; --grade-d:#B23A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{
    display:flex;align-items:baseline;gap:14px;padding:16px 22px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  header h1{font-size:19px;margin:0;font-weight:700;}
  header h1 span{color:var(--amber);}
  header p{margin:0;font-size:13px;color:var(--muted);}
  a{color:var(--amber);text-decoration:none;font-size:13px;margin-left:auto;}

  #gate{
    max-width:360px;margin:90px auto;padding:32px;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;text-align:center;
  }
  #gate h2{margin:0 0 8px;font-size:18px;}
  #gate p{margin:0 0 20px;color:var(--muted);font-size:13px;}
  #gate input{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;
    font-size:14px;margin-bottom:12px;font-family:inherit;
  }
  #gate button{
    width:100%;background:var(--amber);color:#FFF6EA;border:none;padding:10px;
    border-radius:3px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  #gate button:hover{background:var(--amber-soft);}
  #gateError{color:var(--grade-d);font-size:12px;margin-top:10px;display:none;}

  #panel{display:none;max-width:960px;margin:0 auto;padding:28px 22px;}
  .warn{
    background:#FFF3E0;border:1px solid var(--amber);color:#8A5A12;border-radius:4px;
    padding:10px 14px;font-size:12.5px;margin-bottom:20px;
  }
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  th, td{padding:10px 12px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line);}
  th{background:var(--panel-2);color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.3px;}
  tr:last-child td{border-bottom:none;}
  .type-chip{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;}
  select.status-select{
    padding:5px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;font-family:inherit;
    background:var(--panel);
  }
  .flags{color:var(--grade-d);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .flags.zero{color:var(--muted-2);}
  .clear-flags{
    background:none;border:1px solid var(--line);color:var(--muted-2);font-size:11px;
    padding:3px 7px;border-radius:3px;cursor:pointer;margin-left:6px;
  }
  .empty{color:var(--muted-2);font-size:13px;padding:30px;text-align:center;}
  #refreshBtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 14px;
    border-radius:3px;font-size:12.5px;cursor:pointer;margin-bottom:16px;
  }
</style>
</head>
<body>

<header>
  <h1>Ward<span>Pulse</span></h1>
  <p>Officer view</p>
  <a href="wardpulse.html">← Back to public map</a>
</header>

<div id="gate">
  <h2>Officer login</h2>
  <p>Sign in with the officer account created in Supabase.</p>
  <input type="email" id="emailInput" placeholder="Email" autocomplete="username">
  <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Sign in</button>
  <div id="gateError">Incorrect email or password.</div>
</div>

<div id="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <button id="refreshBtn" style="margin-bottom:0;">↻ Refresh reports</button>
    <button id="logoutBtn" style="background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:3px;font-size:12.5px;cursor:pointer;">Sign out</button>
  </div>
  <table>
    <thead>
      <tr><th>Type</th><th>Locality</th><th>Note</th><th>Reported</th><th>Flags</th><th>Status</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="emptyState" class="empty" style="display:none;">No reports found — check your Supabase keys are filled in below.</div>
</div>

<script>
(function(){
  // Must match the same project as wardpulse.html.
  const SUPABASE_URL = '';       // e.g. 'https://xxxxxxxx.supabase.co'
  const SUPABASE_ANON_KEY = '';  // the long 'anon public' key

  const TYPE_COLORS = {power:'#C9660E', water:'#3E6E96', light:'#6E5AA6', other:'#7A837D'};
  const TYPE_LABELS = {power:'Power cut', water:'Water leak', light:'Streetlight', other:'Other'};

  const supa = (SUPABASE_URL && SUPABASE_ANON_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtDate(ts){
    return new Date(Number(ts)).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  }

  async function loadRows(){
    const tbody = document.getElementById('rows');
    const empty = document.getElementById('emptyState');
    if(!supa){
      empty.style.display = 'block';
      tbody.innerHTML = '';
      return;
    }
    const { data, error } = await supa.from('reports').select('*').order('ts', {ascending:false});
    if(error || !data || data.length === 0){
      empty.style.display = 'block';
      tbody.innerHTML = '';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = data.map(r => `
      <tr>
        <td><span class="type-chip" style="background:${TYPE_COLORS[r.type]}22;color:${TYPE_COLORS[r.type]}">${TYPE_LABELS[r.type]||r.type}</span></td>
        <td>${escapeHtml(r.locality)}</td>
        <td style="max-width:220px;color:var(--muted)">${escapeHtml(r.note||'—')}</td>
        <td class="mono">${fmtDate(r.ts)}</td>
        <td>
          <span class="flags ${!r.flags ? 'zero' : ''}">${r.flags||0}</span>
          ${r.flags ? `<button class="clear-flags" data-id="${r.id}">clear</button>` : ''}
        </td>
        <td>
          <select class="status-select" data-id="${r.id}">
            <option value="open" ${r.status==='open'||!r.status?'selected':''}>Open</option>
            <option value="acknowledged" ${r.status==='acknowledged'?'selected':''}>Acknowledged</option>
            <option value="resolved" ${r.status==='resolved'?'selected':''}>Resolved</option>
          </select>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        await supa.from('reports').update({status: sel.value}).eq('id', sel.dataset.id);
      });
    });
    tbody.querySelectorAll('.clear-flags').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supa.from('reports').update({flags: 0}).eq('id', btn.dataset.id);
        loadRows();
      });
    });
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    if(!supa){ document.getElementById('gateError').textContent = 'Supabase keys not set in this page yet.'; document.getElementById('gateError').style.display = 'block'; return; }
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const { error } = await supa.auth.signInWithPassword({ email, password });
    if(error){
      document.getElementById('gateError').textContent = error.message;
      document.getElementById('gateError').style.display = 'block';
    } else {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      loadRows();
    }
  });
  document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('loginBtn').click();
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if(supa) await supa.auth.signOut();
    document.getElementById('panel').style.display = 'none';
    document.getElementById('gate').style.display = 'block';
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
  });
  document.getElementById('refreshBtn').addEventListener('click', loadRows);

  // If there's already a valid signed-in session (e.g. page refresh), skip the login screen.
  (async () => {
    if(!supa) return;
    const { data } = await supa.auth.getSession();
    if(data && data.session){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      loadRows();
    }
  })();
})();
</script>
</body>
</html>
